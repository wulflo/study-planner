name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente de la release (por ejemplo v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  appimage:
    name: AppImage firmado
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Dependencias de sistema para Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Dependencias npm
        run: npm ci

      - name: Comprobar la clave pública del updater
        run: |
          file="crates/study-planner-updater/updater.pub"
          if [[ ! -f "$file" ]] || ! grep -qv '^#' "$file"; then
            echo "::error::$file es un placeholder; configurá la clave pública antes de publicar."
            exit 1
          fi

      - name: Build del AppImage
        run: npm run tauri build -- --bundles appimage

      - name: Firmar y generar latest.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/package-release.mjs

      - name: Verificar la firma contra la clave embebida
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo run --quiet -p study-planner-updater --example verify_release -- \
            "dist-release/study-planner_${version}_x86_64.AppImage" \
            "dist-release/study-planner_${version}_x86_64.AppImage.sig" \
            "$version"

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist-release/latest.json \
              dist-release/*.AppImage \
              dist-release/*.AppImage.sig \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist-release/latest.json \
              dist-release/*.AppImage \
              dist-release/*.AppImage.sig \
              --title "Study Planner $RELEASE_TAG" \
              --generate-notes \
              --latest
          fi
