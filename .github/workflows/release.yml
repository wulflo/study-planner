name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente de la release (por ejemplo v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (AppImage, deb, rpm)
            os: ubuntu-24.04
            bundles: appimage,deb,rpm
            artifact: linux
          - name: Windows (NSIS, MSI)
            os: windows-latest
            bundles: nsis,msi
            artifact: windows
          - name: macOS (DMG)
            os: macos-15
            bundles: dmg
            artifact: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            rpm \
            wget

      - name: Dependencias npm
        run: npm ci

      - name: Comprobar la clave pública del updater
        run: |
          file="crates/study-planner-updater/updater.pub"
          if [[ ! -f "$file" ]] || ! grep -qv '^#' "$file"; then
            echo "::error::$file es un placeholder; configurá la clave pública antes de publicar."
            exit 1
          fi
        shell: bash

      - name: Build de los paquetes
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Firmar deb, rpm, exe, msi y dmg
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_OUT_DIR: dist-release
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/package-artifacts.mjs

      - name: Firmar AppImage y generar manifiesto (Linux)
        if: runner.os == 'Linux'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/package-release.mjs

      - name: Verificar la firma del AppImage contra la clave embebida
        if: runner.os == 'Linux'
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo run --quiet -p study-planner-updater --example verify_release -- \
            "dist-release/study-planner_${version}_x86_64.AppImage" \
            "dist-release/study-planner_${version}_x86_64.AppImage.sig" \
            "$version"

      - name: Subir artefactos de la plataforma
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}
          path: dist-release
          if-no-files-found: error

  release:
    name: Publicar release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Descargar artefactos
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release

      - name: Verificar la política de privacidad
        run: |
          test -f PRIVACY.md
          echo "PRIVACY.md presente para Microsoft Store"

      - name: Fusionar manifiestos de plataformas
        env:
          RELEASE_OUT_DIR: dist-release
        run: node scripts/merge-manifests.mjs

      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob
          files=(dist-release/*)
          if (( ${#files[@]} == 0 )); then
            echo "::error::no hay artefactos para publicar"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --title "Study Planner $RELEASE_TAG" \
              --generate-notes \
              --latest
          fi

# Notas:
# - Linux: AppImage, .deb y .rpm, firmados. El AppImage se actualiza solo;
#   .deb/.rpm usan pkexec + dpkg/dnf/zypper/rpm.
# - Windows: NSIS (.exe) y MSI, firmados con la clave de Tauri (firma de
#   integridad, no Authenticode). El MSIX no se genera acá: lo arma el workflow
#   independiente .github/workflows/store-msix.yml con MakeAppx y se sube SIN
#   firmar al Partner Center, donde Microsoft Store aplica su identidad y firma.
#   En el MSIX la app oculta el autoactualizador.
# - PRIVACY.md es obligatoria para publicar en Microsoft Store.
# - macOS: .dmg firmado con la clave de Tauri (integridad, no notarización
#   Apple). El updater reemplaza el bundle .app y lo reabre.
# - Cada job escribe un manifiesto parcial; el job de release los fusiona en
#   latest.json antes de publicar.
