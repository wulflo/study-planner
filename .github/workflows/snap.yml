name: Snap

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal de la Snap Store"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - edge
  pull_request:
    paths:
      - "snap/**"
      - ".snapcraftignore"
      - ".github/workflows/snap.yml"
      - "scripts/check-snap-version.sh"

permissions:
  contents: read

concurrency:
  group: snap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar snap
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verificar versión del snap
        run: bash scripts/check-snap-version.sh

      - name: Compilar snap
        id: build
        uses: snapcore/action-build@v1.3.0

      - name: Subir artefacto
        uses: actions/upload-artifact@v7
        with:
          name: study-planner-snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

      # Solo se publica al lanzar el workflow a mano. Los builds de pull_request
      # (incluidos los de forks, sin acceso a secretos) nunca suben a la tienda.
      - name: Publicar en la Snap Store
        if: github.event_name == 'workflow_dispatch'
        uses: snapcore/action-publish@v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ inputs.channel }}
