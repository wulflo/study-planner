name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests y verificación
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Dependencias de Cargo
        # cargo fetch trae también las dependencias de otros targets (p. ej.
        # hermit-abi), que cargo metadata necesita para la auditoría offline.
        run: cargo fetch --locked

      - name: Dependencias de sistema para Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Dependencias npm
        run: npm ci

      - name: Verificación de frontend
        run: npm run check

      - name: Sintaxis de los scripts de empaquetado
        run: |
          node --check scripts/package-msix.mjs
          node --check scripts/package-artifacts.mjs
          node --check scripts/package-release.mjs
          node --check scripts/merge-manifests.mjs

      - name: Formato de Rust
        run: cargo fmt --all -- --check

      - name: Clippy de los crates
        run: |
          cargo clippy \
            -p study-planner-core -p study-planner-store \
            -p study-planner-transfer -p study-planner-updater \
            --all-targets -- -D warnings

      - name: Clippy del host Tauri
        run: cargo clippy -p study-planner --all-targets -- -D warnings

      - name: Tests de los crates
        run: |
          cargo test \
            -p study-planner-core -p study-planner-store \
            -p study-planner-transfer -p study-planner-updater

      - name: Tests de la bóveda y el host
        run: cargo test -p study-planner

      - name: Check del host Tauri
        run: cargo check -p study-planner

      - name: Auditoría de red, permisos y secretos
        run: bash scripts/audit-network.sh

      - name: Auditoría de licencias
        run: bash scripts/audit-licenses.sh
