name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests y verificación
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Dependencias de sistema para Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Dependencias npm
        run: npm ci

      - name: Verificación de frontend
        run: npm run check

      - name: Formato de Rust
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p omega-core -p omega-store -p omega-transfer --all-targets -- -D warnings

      - name: Tests de Rust
        run: cargo test -p omega-core -p omega-store -p omega-transfer

      - name: Check del host Tauri
        run: cargo check -p omega
